name: Build-Dev

on:
  push:
    branches:
      - dev

jobs:
  release:
    name: Build MoleVerse development client
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ 'windows-2025', 'macos-15', 'ubuntu-24.04', 'ubuntu-24.04-arm' ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: dist
